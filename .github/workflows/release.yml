name: Release Emerge Mono SEO

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to publish (for example 1.28.2)
        required: true

permissions:
  contents: write

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare distribution candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/emerge-mono-seo
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='tests' \
            ./ build/emerge-mono-seo/
      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/emerge-mono-seo'
          # GitHub Releases is this plugin's official distribution channel.
          # The updater check only applies to WordPress.org-hosted plugins.
          exclude-checks: 'plugin_updater'

  release:
    needs: plugin-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify stable version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ "$version" == *-* ]]; then
            echo "Only stable releases are public." >&2
            exit 1
          fi
          grep -Eq "Version:[[:space:]]+$version$" emerge-mono-seo.php

      - name: Build plugin ZIP
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          mkdir -p dist/emerge-mono-seo
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' --exclude='dist' --exclude='tests' ./ dist/emerge-mono-seo/
          cd dist
          zip -qr "emerge-mono-seo-$version.zip" emerge-mono-seo
          shasum -a 256 "emerge-mono-seo-$version.zip" > "emerge-mono-seo-$version.zip.sha256"

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          gh release create "v$version" dist/*.zip dist/*.sha256 --generate-notes --verify-tag
